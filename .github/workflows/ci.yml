name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: experimentx_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests (no DB required)
        run: pytest tests/ --ignore=tests/integration -q

      - name: Run integration tests (real Postgres)
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/experimentx_test
        run: pytest tests/integration -q

  migration-check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: experimentx_migrations
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: alembic upgrade head from an empty database
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/experimentx_migrations
          SECRET_KEY: ci-secret-key-not-for-production
        run: alembic upgrade head

      - name: Round-trip downgrade to base, then upgrade again
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/experimentx_migrations
          SECRET_KEY: ci-secret-key-not-for-production
        run: |
          alembic downgrade base
          alembic upgrade head

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Lint (non-blocking — pre-existing debt, tracked separately)
        run: npm run lint
        continue-on-error: true